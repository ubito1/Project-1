<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASCII Art Web</title>
</head>
<body>
    <div>
        <form method="POST" action="/Ascii-art">
            <h3>ascii-art-web</h3>
            <label for="word">word</label><br>
            <textarea id="word" name="word" rows="5" cols="50">{{.Input}}</textarea><br><br>

            <input type="radio" id="standard" name="font" value="standard" {{if eq .Banner "standard"}}checked{{end}}>
            <label for="standard">standard</label><br>

            <input type="radio" id="shadow" name="font" value="shadow" {{if eq .Banner "shadow"}}checked{{end}}>
            <label for="shadow">shadow</label><br>

            <input type="radio" id="thinkertoy" name="font" value="thinkertoy" {{if eq .Banner "thinkertoy"}}checked{{end}}>
            <label for="thinkertoy">thinkertoy</label><br><br>

            <input type="submit" value="submit">
        </form>

        {{if .Error}}
            <br>
            <pre style="color: red;">HTTP {{.StatusCode}} Error: {{.Error}}</pre>
        {{end}}

        {{if .Result}}
            <br>
            <pre>{{.Result}}</pre>
        {{end}}
    </div>
</body>
</html>
